<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      .note {
        color: #fff;
        font-family: system-ui, sans-serif;
        font-size: 40px;
        text-align: center;
        padding: 0 120px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1080"
      data-height="1920"
    >
      <div id="placeholder" class="clip note" data-start="0" data-duration="5" data-track-index="1" style="display: grid; place-items: center; position: absolute; inset: 0">
        <p>reaction_demo template — generate reels with <code>node new-reel.mjs</code>, then render the generated <code>host-&lt;name&gt;.html</code>.</p>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
